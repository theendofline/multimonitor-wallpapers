[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimonitor-wallpapers"
version = "0.2.0"
description = "Set different wallpapers on multiple monitors (Linux)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.11.0",
  "pillow==12.2.0",
]

[project.scripts]
multimonitor-wallpapers = "multimonitor_wallpapers.ui:main"

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "black==26.3.1",
  "ruff==0.15.12",
  "mypy==2.0.0",
]
build = [
  "build>=1.2.0",
  "wheel>=0.45.0",
  "setuptools>=75.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
mypy_path = "src"
