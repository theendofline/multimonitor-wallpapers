# https://pre-commit.com
# Install: uv tool install pre-commit && pre-commit install
# Run:     pre-commit run --all-files
# commitlint runs on the commit-msg hook installed by `pre-commit install`.

default_install_hook_types: [pre-commit, commit-msg]

default_language_version:
  python: python3.12

exclude: ^(\.venv/|dist/|squashfs-root/|src/.*\.egg-info/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --ignore, E501]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.12

  # GitHub Actions checks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    - id: actionlint

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.3"]
