name: Build and Release (main)

on:
  push:
    branches:
      - main

concurrency:
  group: multimonitor-build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (locked)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev

      - name: Lint
        run: |
          set -euo pipefail
          uv run ruff check --ignore E501 .
          uv run black --check .

      - name: Install system dependencies for tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libxcomposite1 libopengl0 libxrender1 libxcursor1 libxi6

      - name: Test
        run: |
          set -euo pipefail
          CI=true xvfb-run --auto-servernum uv run pytest

  release:
    name: Build artifacts and release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: quality-gate
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Install build system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 desktop-file-utils libglib2.0-bin \
            dpkg-dev fakeroot \
            libegl1 libgl1 libxcomposite1 libopengl0 libxrender1 libxcursor1 libxi6 \
            libdrm2 libxau6 libxdmcp6 libxext6 libxkbcommon0 libdbus-1-3 libx11-6 \
            libglib2.0-0 libfontconfig1 libcups2 libpango-1.0-0 libcairo2 libsm6 libxrandr2

      - name: Configure git for semantic-release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN != '' && secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Surface the workflow run number so build_release_artifacts.sh
          # can use it as the Debian revision when nothing better is set.
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          npx -y \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/changelog \
            -p @semantic-release/exec \
            -p @semantic-release/git \
            -p @semantic-release/github \
            -p conventional-changelog-conventionalcommits \
            semantic-release

      - name: Publish artifact summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Release artifacts"
            echo ""
            if compgen -G 'dist/*' > /dev/null; then
              echo "| File | Size |"
              echo "|------|------|"
              for f in dist/*; do
                echo "| \`$(basename "$f")\` | $(stat -c%s "$f") bytes |"
              done
            else
              echo "_No artifacts in \`dist/\` (no release published)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
