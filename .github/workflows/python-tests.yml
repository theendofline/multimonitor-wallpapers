name: Development checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multimonitor-dev-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (locked)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev

      - name: Lint
        run: |
          set -euo pipefail
          uv run ruff check --ignore E501 .
          uv run black --check .

      - name: Install system dependencies for tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libxcomposite1 libopengl0 libxrender1 libxcursor1 libxi6

      - name: Test
        run: |
          set -euo pipefail
          CI=true xvfb-run --auto-servernum uv run pytest
