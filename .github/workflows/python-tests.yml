name: Development checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multimonitor-dev-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (locked)
        run: |
          set -euo pipefail
          uv sync --frozen --no-build --no-binary-package multimonitor-wallpapers --extra dev

      - name: Lint
        run: |
          set -euo pipefail
          uv run --frozen --no-build --no-binary-package multimonitor-wallpapers ruff check --ignore E501 .
          uv run --frozen --no-build --no-binary-package multimonitor-wallpapers black --check .

      - name: Install system dependencies for tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libxcomposite1 libopengl0 libxrender1 libxcursor1 libxi6

      - name: Test
        run: |
          set -euo pipefail
          CI=true xvfb-run --auto-servernum uv run --frozen --no-build --no-binary-package multimonitor-wallpapers pytest

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run pre-commit
        run: |
          set -euo pipefail
          uv tool run --no-build --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Lint commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            from="$PR_BASE"
            to="$PR_HEAD"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            echo "New branch with no base; skipping range lint."
            exit 0
          else
            from="$PUSH_BEFORE"
            to="$PUSH_SHA"
          fi
          npx --ignore-scripts -y \
            -p @commitlint/cli@21.2.3 \
            -p @commitlint/config-conventional@21.2.3 \
            commitlint --from "$from" --to "$to" --verbose
